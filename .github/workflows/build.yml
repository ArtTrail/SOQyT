name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install requests openpyxl xlrd pyinstaller pillow

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        working-directory: Version 1.3.2
        run: |
          python3 <<'EOF'
          from PIL import Image
          import os, subprocess
          img = Image.open('SOQyT.ico').convert('RGBA')
          iconset = 'SOQyT.iconset'
          os.makedirs(iconset, exist_ok=True)
          for size, name in [
              (16,  'icon_16x16'),     (32,  'icon_16x16@2x'),
              (32,  'icon_32x32'),     (64,  'icon_32x32@2x'),
              (128, 'icon_128x128'),   (256, 'icon_128x128@2x'),
              (256, 'icon_256x256'),   (512, 'icon_256x256@2x'),
          ]:
              img.resize((size, size), Image.LANCZOS).save(f'{iconset}/{name}.png')
          subprocess.run(['iconutil', '-c', 'icns', iconset], check=True)
          EOF

      - name: Build
        working-directory: Version 1.3.2
        run: python -m PyInstaller "Stellar Object Query Tool.spec" --noconfirm

      - name: Resolve tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          Compress-Archive `
            -Path "Version 1.3.2/dist/Stellar Object Query Tool" `
            -DestinationPath "Stellar_Object_Query_Tool_${tag}_win64.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "Version 1.3.2/dist"
          zip -r "../../Stellar_Object_Query_Tool_${RELEASE_TAG}_macos.zip" \
            "Stellar Object Query Tool.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "Stellar_Object_Query_Tool_${RELEASE_TAG}_linux.tar.gz" \
            -C "Version 1.3.2/dist" "Stellar Object Query Tool"

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_win64.zip"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_macos.zip"
          else
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_linux.tar.gz"
          fi
          gh release upload "$RELEASE_TAG" "$FILE" --clobber
