name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win64
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install requests openpyxl xlrd pyinstaller

      - name: Build
        working-directory: Version 1.2.0
        run: python -m PyInstaller "Stellar Object Query Tool.spec" --noconfirm

      - name: Resolve tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          Compress-Archive `
            -Path "Version 1.2.0/dist/Stellar Object Query Tool" `
            -DestinationPath "Stellar_Object_Query_Tool_${tag}_win64.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "Stellar Object Query Tool" \
            -srcfolder "Version 1.2.0/dist/Stellar Object Query Tool.app" \
            -ov -format UDZO \
            "Stellar_Object_Query_Tool_${RELEASE_TAG}_macos.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "Stellar_Object_Query_Tool_${RELEASE_TAG}_linux.tar.gz" \
            -C "Version 1.2.0/dist" "Stellar Object Query Tool"

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_win64.zip"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_macos.dmg"
          else
            FILE="Stellar_Object_Query_Tool_${RELEASE_TAG}_linux.tar.gz"
          fi
          gh release upload "$RELEASE_TAG" "$FILE" --clobber
